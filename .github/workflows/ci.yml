name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Tests (self-contained -- conftest trains a small model)
        run: .venv/bin/python -m pytest -q
      - name: Training smoke (small n)
        run: |
          .venv/bin/python scripts/run_training.py --n 4000
          .venv/bin/python scripts/simulate_drift.py
